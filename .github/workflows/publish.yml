name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # OIDC for npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A release waits for a reviewer. Set up before merging this (GitHub creates a missing
    # environment on first use with no protection rules): Settings > Environments > npm-publish,
    # with required reviewers, "Prevent self-review" on, and deployments limited to tags v*.
    # Then name the environment in the package's npm trusted publisher settings.
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # This job can mint an npm publish token, so no dependency install scripts run in it.
      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: node scripts/run-tests.mjs

      # Guard: the tag must match package.json version (v1.2.3 -> 1.2.3)
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # Auth via OIDC trusted publishing - no npm token anywhere.
      # Requires the trusted publisher to be configured for this package on
      # npmjs.com (repo: NightSquawk/mcp-core, workflow: publish.yml).
      - run: npm publish --provenance --access public
